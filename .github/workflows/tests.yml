name: Python Tests

# 设置触发条件：当有代码被推送到拉取请求 (Pull Request) 时触发
on:
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10" # 可以根据你们课程要求的版本调整

    - name: Install dependencies (可选)
      run: |
        python -m pip install --upgrade pip
        pip install pytest

    - name: Run tests
      # 运行 tutorial_7 目录下的所有 test_*.py 文件
      run: |
        pytest tutorial_7/